{{- if .Values.collectors }}
{{- $groups := dict -}}
{{- range $item := .Values.collectors }}
{{- $device := include "scada.device" $item.address | trim -}}
{{- if not $device }}
{{- fail "collector has no address" }}
{{- end }}
{{- if not $item.path }}
{{- fail (printf "collector %s has no path" $device) }}
{{- end }}
{{- if not $item.command }}
{{- fail (printf "collector %s has no command" $device) }}
{{- end }}
{{- $prior := list -}}
{{- if hasKey $groups $device }}
{{- $prior = index $groups $device -}}
{{- end }}
{{- $groups = set $groups $device (append $prior $item) -}}
{{- end }}
{{- range $device, $items := $groups }}
{{- $encoded := "" -}}
{{- range $item := $items }}
{{- $next := $item.command | toJson -}}
{{- if and $encoded (ne $encoded $next) }}
{{- fail (printf "collectors on %s use different commands" $device) }}
{{- end }}
{{- $encoded = $next -}}
{{- end }}
{{- $slug := include "scada.slug" $device | trim -}}
{{- if not $slug }}
{{- fail (printf "collector %s has no name" $device) }}
{{- end }}
{{- $paths := list -}}
{{- $maps := list -}}
{{- $addresses := list -}}
{{- range $item := $items }}
{{- $paths = append $paths $item.path -}}
{{- $maps = append $maps ($item.mapping | default (dict)) -}}
{{- $addresses = append $addresses $item.address -}}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-collector-{{ $slug }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "scada.labels" $ | nindent 4 }}
    app: collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
      app.kubernetes.io/instance: {{ $.Release.Name }}
      scada/device: {{ $slug }}
  template:
    metadata:
      labels:
        {{- include "scada.labels" $ | nindent 8 }}
        app: collector
        scada/device: {{ $slug }}
    spec:
      {{- with $.Values.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: collector
          image: {{ required "image is required" $.Values.image | quote }}
          command: {{ (index $items 0).command | toJson }}
          {{- if hasPrefix "/dev/" $device }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: serial
              mountPath: {{ $device }}
          {{- end }}
          env:
            - name: ADDRESS
              value: {{ $addresses | toJson | quote }}
            - name: PATH
              value: {{ $paths | toJson | quote }}
            - name: MAPPING
              value: {{ $maps | toJson | quote }}
            {{- if $.Values.rabbitmq.enabled }}
            - name: MQTT_URL
              value: {{ printf "mqtt://%s-rabbitmq:1883" $.Release.Name | quote }}
            {{- end }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
      {{- if hasPrefix "/dev/" $device }}
      volumes:
        - name: serial
          hostPath:
            path: {{ $device }}
            type: CharDevice
      {{- end }}
{{- end }}
{{- end }}
