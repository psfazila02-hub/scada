{{- if .Values.rabbitmq.enabled }}
{{- $ingest := list -}}
{{- $outgoing := list -}}
{{- range .Values.collectors }}
{{- if .path }}
{{- $ingest = append $ingest (include "scada.routingKey" .path | trim) -}}
{{- end }}
{{- end }}
{{- range $item := concat (.Values.buses | default (list)) (.Values.bus | default (list)) }}
{{- range $name := ($item.names | default (list)) }}
{{- $routed := include "scada.routingKey" $name | trim -}}
{{- $ingest = append $ingest $routed -}}
{{- $outgoing = append $outgoing $routed -}}
{{- end }}
{{- end }}
{{- $outgoing = $outgoing | uniq -}}
{{- if $ingest }}
{{- $ingest = $ingest | uniq -}}
{{- else }}
{{- $ingest = list "#" -}}
{{- end }}
{{- $exchange := list
  (dict "name" "scada.alerts" "vhost" "/" "type" "topic" "durable" true "auto_delete" false)
  (dict "name" "scada.segments" "vhost" "/" "type" "topic" "durable" true "auto_delete" false)
  (dict "name" "scada.telemetry" "vhost" "/" "type" "topic" "durable" true "auto_delete" false)
  (dict "name" "scada.operations" "vhost" "/" "type" "topic" "durable" true "auto_delete" false)
  (dict "name" "scada.user_decisions" "vhost" "/" "type" "topic" "durable" true "auto_delete" false)
-}}
{{- $queue := list
  (dict "name" "scada.segments.ingest" "vhost" "/" "durable" true "auto_delete" false)
  (dict "name" "scada.telemetry.ingest" "vhost" "/" "durable" true "auto_delete" false)
  (dict "name" "scada.operations.ingest" "vhost" "/" "durable" true "auto_delete" false)
  (dict "name" "scada.user_decisions" "vhost" "/" "durable" true "auto_delete" false)
-}}
{{- if $outgoing }}
{{- $queue = append $queue (dict "name" "scada.telemetry.outbox" "vhost" "/" "durable" true "auto_delete" false) -}}
{{- end }}
{{- $policies := list -}}
{{- with .Values.rabbitmq.deadLetter }}
{{- $queue = append $queue (dict "name" .queue "vhost" "/" "durable" true "auto_delete" false) -}}
{{- $policies = append $policies (dict "name" "ingest-dlq" "vhost" "/" "pattern" "^scada\\.(segments|operations|telemetry)\\.ingest$" "apply-to" "queues" "priority" 10 "definition" (dict "dead-letter-exchange" "" "dead-letter-routing-key" .queue)) -}}
{{- end }}
{{- $binding := list -}}
{{- range $key := $ingest }}
{{- $binding = append $binding (dict "source" "scada.telemetry" "vhost" "/" "destination" "scada.telemetry.ingest" "destination_type" "queue" "routing_key" $key) -}}
{{- end }}
{{- range $pair := (list
  (dict "source" "scada.operations" "destination" "scada.operations.ingest")
  (dict "source" "scada.segments" "destination" "scada.segments.ingest")
  (dict "source" "scada.user_decisions" "destination" "scada.user_decisions")) }}
{{- $binding = append $binding (dict "source" $pair.source "vhost" "/" "destination" $pair.destination "destination_type" "queue" "routing_key" "#") -}}
{{- end }}
{{- range $key := $outgoing }}
{{- $binding = append $binding (dict "source" "scada.telemetry" "vhost" "/" "destination" "scada.telemetry.outbox" "destination_type" "queue" "routing_key" $key) -}}
{{- end }}
{{- $definitions := dict
  "vhosts" (list (dict "name" "/"))
  "users" (list (dict "name" "guest" "password" "guest" "tags" (list "administrator")))
  "permissions" (list (dict "user" "guest" "vhost" "/" "configure" ".*" "write" ".*" "read" ".*"))
  "exchanges" $exchange
  "queues" $queue
  "policies" $policies
  "bindings" $binding
-}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-rabbitmq
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scada.labels" . | nindent 4 }}
    app: rabbitmq
data:
  enabled_plugins: |
    [rabbitmq_stomp, rabbitmq_mqtt, rabbitmq_management].
  rabbitmq.conf: |
    load_definitions = /etc/rabbitmq/definitions.json
    mqtt.listeners.tcp.default = 1883
    mqtt.allow_anonymous = true
    mqtt.vhost = /
    mqtt.exchange = scada.telemetry
  definitions.json: |
{{ $definitions | toPrettyJson | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rabbitmq
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scada.labels" . | nindent 4 }}
    app: rabbitmq
spec:
  {{- $svc := .Values.rabbitmq.service | default dict }}
  type: {{ $svc.type | default "ClusterIP" }}
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
      {{- with $svc.nodePorts }}
      {{- if .amqp }}
      nodePort: {{ .amqp }}
      {{- end }}
      {{- end }}
    - name: mqtt
      port: 1883
      targetPort: mqtt
    - name: stomp
      port: 61613
      targetPort: stomp
      {{- with $svc.nodePorts }}
      {{- if .stomp }}
      nodePort: {{ .stomp }}
      {{- end }}
      {{- end }}
    - name: management
      port: 15672
      targetPort: management
      {{- with $svc.nodePorts }}
      {{- if .management }}
      nodePort: {{ .management }}
      {{- end }}
      {{- end }}
  selector:
    {{- include "scada.match" (dict "app" "rabbitmq" "ctx" .) | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-rabbitmq
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scada.labels" . | nindent 4 }}
    app: rabbitmq
spec:
  serviceName: {{ .Release.Name }}-rabbitmq
  replicas: 1
  selector:
    matchLabels:
      {{- include "scada.match" (dict "app" "rabbitmq" "ctx" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "scada.labels" . | nindent 8 }}
        {{- include "scada.match" (dict "app" "rabbitmq" "ctx" .) | nindent 8 }}
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image | quote }}
          ports:
            - name: amqp
              containerPort: 5672
            - name: mqtt
              containerPort: 1883
            - name: stomp
              containerPort: 61613
            - name: management
              containerPort: 15672
          volumeMounts:
            - name: config
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
            - name: config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
            - name: config
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        {{- include "scada.claim" (dict "size" .Values.rabbitmq.storage "class" .Values.rabbitmq.storageClass) | nindent 8 }}
{{- end }}
