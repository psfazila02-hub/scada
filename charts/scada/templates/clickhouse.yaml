{{- if .Values.clickhouse.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scada.prefix" . }}-clickhouse
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scada.labels" . | nindent 4 }}
    app: clickhouse
spec:
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
    - name: metrics
      port: 9363
      targetPort: metrics
  selector:
    {{- include "scada.match" (dict "app" "clickhouse" "ctx" .) | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "scada.prefix" . }}-clickhouse
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scada.labels" . | nindent 4 }}
    app: clickhouse
spec:
  serviceName: {{ include "scada.prefix" . }}-clickhouse
  replicas: 1
  selector:
    matchLabels:
      {{- include "scada.match" (dict "app" "clickhouse" "ctx" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "scada.labels" . | nindent 8 }}
        {{- include "scada.match" (dict "app" "clickhouse" "ctx" .) | nindent 8 }}
    spec:
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image | quote }}
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
            - name: metrics
              containerPort: 9363
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        {{- include "scada.claim" (dict "size" .Values.clickhouse.storage "class" .Values.clickhouse.storageClass) | nindent 8 }}
{{- end }}
